name: public Scintilla Cargo lock generator

on:
  push:
    branches:
      - audit/public-scintilla-lock-20260928

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
      - name: Generate and verify lockfile
        working-directory: fixtures/scintilla-desktop-daemon-lock
        run: |
          set -euo pipefail
          cargo +1.90.0 generate-lockfile
          cargo +1.90.0 metadata --locked --format-version 1 >/dev/null
          grep -F 'source = "git+https://github.com/ORESoftware/flags-2-env.git?rev=5a44d6a38f06c2765e80676618fd72bf4e59b984#' Cargo.lock
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scintilla-desktop-daemon-cargo-lock
          path: fixtures/scintilla-desktop-daemon-lock/Cargo.lock
          if-no-files-found: error
