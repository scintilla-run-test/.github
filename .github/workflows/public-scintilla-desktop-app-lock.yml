name: public Scintilla desktop app Cargo lock generator

on:
  push:
    branches:
      - audit/scintilla-desktop-app-lock-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
      - name: Generate exact dependency lock
        working-directory: fixtures/scintilla-desktop-app-lock
        run: |
          set -euo pipefail
          cargo +1.90.0 generate-lockfile
          cargo +1.90.0 metadata --locked --format-version 1 >/dev/null
          grep -F 'source = "git+https://github.com/ORESoftware/flags-2-env.git?rev=5a44d6a38f06c2765e80676618fd72bf4e59b984#5a44d6a38f06c2765e80676618fd72bf4e59b984"' Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scintilla-desktop-app-cargo-lock
          path: fixtures/scintilla-desktop-app-lock/Cargo.lock
          if-no-files-found: error
