name: public BeamScale Cargo lock generator

on:
  push:
    branches:
      - audit/public-beamscale-lock-20260928

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
      - name: Generate and verify lockfile
        working-directory: fixtures/beamscale-desktop-daemon-lock
        run: |
          set -euo pipefail
          cargo +1.90.0 generate-lockfile
          cargo +1.90.0 metadata --locked --format-version 1 >/dev/null
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git add fixtures/beamscale-desktop-daemon-lock/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: generate exact BeamScale daemon Cargo.lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
