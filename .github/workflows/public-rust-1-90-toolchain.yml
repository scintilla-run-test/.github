name: public Rust 1.90 multi-target toolchain

on:
  push:
    branches:
      - audit/public-beamscale-lock-20260928

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          targets: x86_64-pc-windows-msvc,x86_64-apple-darwin
      - name: Package toolchain
        run: |
          set -euo pipefail
          toolchain="$(rustc +1.90.0 --print sysroot)"
          tar -C "$(dirname "$toolchain")" -czf rust-1.90.0-multitarget.tar.gz "$(basename "$toolchain")"
          ls -lh rust-1.90.0-multitarget.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-1.90.0-multitarget
          path: rust-1.90.0-multitarget.tar.gz
          if-no-files-found: error
