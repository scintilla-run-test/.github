name: public BeamScale cargo cache

on:
  push:
    branches:
      - audit/public-beamscale-lock-20260928

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt,clippy
      - name: Fetch exact public dependencies
        working-directory: fixtures/beamscale-desktop-daemon-lock
        run: |
          set -euo pipefail
          cargo +1.90.0 fetch --locked
      - name: Package Cargo registry
        run: |
          set -euo pipefail
          tar -C "${CARGO_HOME:-$HOME/.cargo}" -czf beamscale-cargo-home.tar.gz registry
          ls -lh beamscale-cargo-home.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: beamscale-cargo-home
          path: beamscale-cargo-home.tar.gz
          if-no-files-found: error
