[package]
name = "scintilla-desktop-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Native Scintilla desktop runtime dashboard"
repository = "https://github.com/scintilla-run/scintilla-desktop-app.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
needless_return = "allow"

[dependencies]
anyhow = "1"
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "5a44d6a38f06c2765e80676618fd72bf4e59b984" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
slint = { version = "1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
tempfile = "3"
